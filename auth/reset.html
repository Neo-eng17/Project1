<!doctype html>
<html lang="en" data-page="reset-password">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | MK Writers</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script type="module" src="../assets/js/pages/reset.js"></script>
</head>
<body>
  <main class="hero">
    <section class="auth-panel">
      <p class="eyebrow">Secure account recovery</p>
      <h1>Set a new password</h1>
      <form data-reset-form>
        <label>New password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
        <button class="button button-primary" type="submit">Update password</button>
        <p class="form-status" data-reset-status role="status"></p>
      </form>
    </section>
  </main>
</body>
</html>
